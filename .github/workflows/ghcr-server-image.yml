name: Server image to GHCR

# Fork-only: rebuilds temporal-server from this branch and layers it over the official
# temporalio/server image of the same ServerVersion, so the entrypoint, config template and
# bundled tools stay exactly as upstream ships them. Pushes
# ghcr.io/<owner>/temporal-server:<ServerVersion>-fix.<sha>.
# Packages start private on GHCR; make the package public once so clusters can pull it without credentials.

permissions:
  contents: read
  packages: write

# workflow_dispatch only shows up for workflows on the default branch, so fork branches build on push.
on:
  push:
    branches: ["build/**"]
  workflow_dispatch:

jobs:
  push:
    name: Build and push server image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build temporal-server
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -o build/$arch/temporal-server ./cmd/server
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          version=$(sed -n 's/^[[:space:]]*ServerVersion = "\(.*\)"/\1/p' common/headers/version_checker.go)
          [ -n "$version" ] || { echo "no ServerVersion in common/headers/version_checker.go" >&2; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/temporal-server:$version-fix.$(git rev-parse --short=7 HEAD)"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg BASE_IMAGE="temporalio/server:$version" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -f .github/docker/fork-server.Dockerfile -t "$image" --push build
          echo "::notice title=GHCR image::$image"
